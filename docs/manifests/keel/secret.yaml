# Keel secret — holds the basic-auth credentials for the Admin UI and API.
#
# PLACEHOLDER — replace this with your own values before applying.
#
# If you do NOT want basic auth, set basicauth.enabled to false in the
# Deployment (see deployment.yaml) and you can delete this Secret along with
# the envFrom reference in the Deployment.
#
# The password is stored base64-encoded in the data field. Encode a plaintext
# password with, for example:
#
#   echo -n 'your-password' | base64
#
# Do NOT commit real credentials to this file. 'YWRtaW4K' below decodes to the
# string "admin".
apiVersion: v1
kind: Secret
metadata:
  name: keel
  namespace: keel
type: Opaque
data:
  # PLACEHOLDER: base64-encoded basic-auth password. e.g. echo -n 'password' | base64
  BASIC_AUTH_PASSWORD: YWRtaW4K
