name: Release Charts
on:
  push:
    tags:
      - "chart-*"

permissions:
  contents: read

concurrency:
  group: release-chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate workflow, tag, and packaged chart
        env:
          KEEL_RELEASE_SKIP_IMAGE: "true"
          KEEL_ENFORCE_UNPUBLISHED: "true"
        run: make release-lint release-package
      - name: Verify referenced application release and image
        env:
          KEEL_PUBLISHED_SKIP_CHART: "true"
        run: |
          APP_VERSION=$(awk '$1 == "appVersion:" {print $2; exit}' chart/keel/Chart.yaml)
          export KEEL_PUBLISHED_APP_VERSION="$APP_VERSION"
          ./scripts/verify-published-release.sh

  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.18.4
      - name: Apply historical packaged-version prefix
        shell: bash
        run: |
          version=$(awk '$1 == "version:" {print $2; exit}' chart/keel/Chart.yaml)
          sed -i "s/^version:.*/version: v${version#v}/" chart/keel/Chart.yaml
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        with:
          charts_dir: chart
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
