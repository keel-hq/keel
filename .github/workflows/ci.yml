name: CI

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run tests
        run: make test

      - name: Check documented API operations
        run: go test -v ./pkg/http -run TestOpenAPIContract

  lint-ui:
    name: Lint UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck, lint, test, and build
        working-directory: ui
        run: npm run typecheck && npm run lint && npm test && npm run build

      - name: Check generated API artifacts
        run: make api-check

  e2e:
    name: End-to-End Tests (k3s)
    # Automatic PR/master gating remains opt-in pending runner-cost approval.
    # Manual workflow_dispatch runs always; set KEEL_E2E_PR_GATE=true to enable current CI triggers.
    if: github.event_name == 'workflow_dispatch' || vars.KEEL_E2E_PR_GATE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Run k3s end-to-end tests
        run: make e2e

      - name: Upload end-to-end diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keel-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test/artifacts/
          if-no-files-found: warn
          retention-days: 7

  docker:
    name: Build Docker Image (${{ matrix.arch }})
    needs: [test, lint-ui, e2e]
    if: always() && needs.test.result == 'success' && needs.lint-ui.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=keel-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=keel-${{ matrix.arch }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Build for PR validation
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=keel-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=keel-${{ matrix.arch }}

  docker-manifest:
    name: Publish Docker Manifest
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*

      - name: Create multi-architecture manifest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t digest_files < <(find /tmp/digests -mindepth 2 -maxdepth 2 -type f | sort)
          digests=()
          for digest_file in "${digest_files[@]}"; do
            digests+=("$(basename "$digest_file")")
          done
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "Expected exactly two architecture digests, found ${#digests[@]}" >&2
            exit 1
          fi

          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unexpected digest artifact name: $digest" >&2
              exit 1
            fi
            sources+=("$IMAGE_NAME@sha256:$digest")
          done

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "Docker metadata produced no tags" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify published manifest
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          expected_hash=""
          for tag in "${tags[@]}"; do
            manifest=$(docker buildx imagetools inspect "$tag" --raw)
            jq -e '
              any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
            ' <<< "$manifest" >/dev/null

            manifest_hash=$(sha256sum <<< "$manifest" | cut -d " " -f 1)
            if [[ -n "$expected_hash" && "$manifest_hash" != "$expected_hash" ]]; then
              echo "Published tags do not point to identical manifests" >&2
              exit 1
            fi
            expected_hash="$manifest_hash"
          done
