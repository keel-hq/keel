{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "keel.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ template "keel.name" . }}
    chart: {{ template "keel.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- with .Values.serviceAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP | quote  }}
  {{- end }}
  {{- if .Values.service.externalIP }}
  externalIPs:
    - {{ .Values.service.externalIP }}
  {{- end }}
  ports:
    - port: {{ .Values.service.externalPort }}
  {{- if or (ne .Values.service.type "ClusterIP") (ne .Values.service.clusterIP "None") }}
      targetPort: {{ ternary 4180 9300 (eq .Values.auth.mode "external-proxy") }}
  {{- end }}
      protocol: TCP
      name: keel
  selector:
    app: {{ template "keel.name" . }}
  sessionAffinity: None
{{- end }}
